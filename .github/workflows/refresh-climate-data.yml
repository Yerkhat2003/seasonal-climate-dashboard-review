name: Refresh climate data

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate weekly climate aggregates
        run: node scripts/refresh-data.mjs
      - name: Commit changed data
        run: |
          git config user.name "seasonal-climate-bot"
          git config user.email "seasonal-climate-bot@users.noreply.github.com"
          git add frontend/public/data/dashboard.json
          git diff --cached --quiet || git commit -m "chore: refresh climate aggregates"
          git push
